title: PowerShell Spawns Windows Command Shell
id: 8c5d6e31-7a24-4f2b-9c81-1e4a7d6b2f90
status: experimental
description: Detects cmd.exe being spawned directly by PowerShell.
author: Prem Charan
date: 2026/10/24

logsource:
    category: process_creation
    product: windows

detection:
    selection:
        Image|endswith: '\cmd.exe'
        ParentImage|endswith: '\powershell.exe'
    condition: selection

falsepositives:
    - Legitimate administrative scripts
    - System administration activity

level: medium

tags:
    - attack.execution
    - attack.t1059.003